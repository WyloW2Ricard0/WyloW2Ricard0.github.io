<!-- 
  Signature de RICHARD Wilfried
  Accessibilité: AAA
-->
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Signature de RICHARD Wilfried, Programmeur statisticien Freelance, Gironde & Landes.">
    <link rel="stylesheet" type="text/css" href="signature.css">
    <script src="signature.js" defer></script>
    <title>Signature</title>
  </head>
  <body>
    <main class="center">
      <table role="presentation" class="base radius">
        <thead>
          <tr>
            <th scope="row" colspan="1" rowspan="2" class="color-sideBar radius-top"
              style="padding: 1.25em 1.00em 0.50em 1.25em;">
              <img id="persn" alt="Photo" class="photo" src="{{persn}}">
            </th>
            <th scope="col" colspan="2" rowspan="1" class="text-left color-control"
              style="padding: 1.00em 1.25em 0.25em 1.00em;">
              <h3>👤
                <span>{{nom}}</span>
                <span id="prenm">{{prenm}}</span>
              </h3>
            </th>
          </tr>
          <tr>
            <td scope="col" colspan="2" rowspan="1" class="text-left"
              style="padding: 0.25em 1.25em 1.75em 1.00em;">
              <h4>🏢 
                <span id="metir" class="color-function">{{metir}}</span>
                <span id="entrp" class="color-class">{{entrp}}</span>
              </h4>
            </td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row" colspan="1" rowspan="3" class="color-sideBar"
              style="padding: 0.50em 1.00em 0.50em 1.25em;">
              <img id="logo" alt="Logo" class="logo" src="{{logo}}">
            </th>
            <td colspan="1" rowspan="1" class="text-left label"
              style="padding: 0.25em 0.25em 0.25em 1.00em;">
              <span class="color-constant">📞 Téléphone</span>
            </td>
            <td colspan="1" rowspan="1" class="text-left"
              style="padding: 0.25em 1.25em 0.25em 0.25em;">
              <span class="color-operator">=</span>
              <a id="tlphn" href="tel:{{tlphn_href}}" class="color-string pontr">{{tlphn}}</a>
            </td>
          </tr>
          <tr>
            <td colspan="1" rowspan="1" class="text-left"
              style="padding: 0.25em 0.25em 0.25em 1.00em;">
              <span class="color-constant">📧 Email</span>
            </td>
            <td colspan="1" rowspan="1" class="text-left"
              style="padding: 0.25em 1.25em 0.25em 0.25em;">
              <span class="color-operator">=</span>
              <a id="email" href="mailto:{{email}}" class="color-string pontr">{{email}}</a>
            </td>
          </tr>
          <tr>
            <td colspan="1" rowspan="1" class="text-left"
              style="padding: 0.25em 0.25em 1.00em 1.00em;">
              <span class="color-constant">🚗 Déplacement</span>
            </td>
            <td colspan="1" rowspan="1" class="text-left"
              style="padding: 0.25em 1.25em 1.00em 0.25em;">
              <span class="color-operator">=</span>
              <span id="dplcm" class="color-string">{{dplcm}}</span>
            </td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th scope="row" colspan="1" rowspan="1" class="color-sideBar radius-bottom justify-around"
              style="padding: 0.50em 1.00em 0.50em 1.25em;">
              <a id="githb" href="{{githb}}">
                <img alt="GitHub" class="icon" src="https://cdn.simpleicons.org/github/FFFFFF" />
              </a>
              <a id="licdn" href="{{licdn}}">
                <img alt="LinkedIn" class="icon" src="https://www.linkedin.com/favicon.ico" />
              </a>
            </th>
            <td colspan="2" rowspan="1" class="text-left color-variable caption"
              style="padding: 0.25em 1.25em 0.50em 1.25em;">
              <span class="color-type">📣 Slogan</span>
              decisions_good
              <span class="color-operator">=</span>
              stats_robust
              <span class="color-operator">+</span>
              vizuel_acces
            </td>
          </tr>
        </tfoot>
      </table>
    </main>
  </body>
</html>
